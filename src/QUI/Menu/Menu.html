<nav class="page-menu" data-qui="{$jsControl}" data-slideOut="mobileMenu-SlideOut" style="display: none;" data-qui-options-control="{$slideOutControl}" data-qui-options-collapse-mobile-submenu={$collapseMobileSubmenu} data-qui-options-menu-button="0">

    <div class="page-navigation {if !$showHomeLink}page-navigation__noHomeLink{/if}">
        {if $showHomeLink}
        <a href="{url site=$Project->firstChild()}" class="page-navigation-home">
            <span class="fa fa-home"></span>
            {$Project->firstChild()->getAttribute('title')}
        </a>
        {/if}

        {include file="`$FileMenu`"
                 Site=$Project->firstChild()
                 ActiveSite=$Site
                 collapseMobileSubmenu=$collapseMobileSubmenu
                 showLevel=$showLevel
        }
    </div>
</nav>
